# Hugo configuration for SafeKit site
baseURL = "https://safekit-dev.eviden.com/"
relativeURLs = true
locale = "en"
title = "SafeKit - High Availability Software"
theme = "safekit"
googleAnalytics = "G-DDCJJTPNYV"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML (for <img> with dimensions)
  [markup.highlight]
    codeFences = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[languages]
  [languages.en]
    weight = 1
    [languages.en.params]
      label = "English"
  [languages.fr]
    weight = 2
    [languages.fr.params]
      label = "Français"
  [languages.ja]
    weight = 3
    [languages.ja.params]
      label = "日本語"
  [languages.zh-hans]
    weight = 4
    [languages.zh-hans.params]
      label = "简体中文"
  [languages.ar]
    weight = 5
    [languages.ar.params]
      label = "العربية"
  [languages.de]
    weight = 6
    [languages.de.params]
      label = "Deutsch"
  [languages.es]
    weight = 7
    [languages.es.params]
      label = "Español"
  [languages.it]
    weight = 8
    [languages.it.params]
      label = "Italiano"
  [languages.ko]
    weight = 9
    [languages.ko.params]
      label = "한국어"
  [languages.pt-br]
    weight = 10
    [languages.pt-br.params]
      label = "Português (Brasil)"
  [languages.pt-pt]
    weight = 11
    [languages.pt-pt.params]
      label = "Português (Portugal)"
  [languages.nl]
    weight = 12
    [languages.nl.params]
      label = "Nederlands"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
    files = ["! {fr,ja,zh-hans,ar,de,es,it,ko,pt-br,pt-pt,nl}/**"]
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["en"]
  [[module.mounts]]
    source = "content/fr"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["fr"]
  [[module.mounts]]
    source = "content/ja"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["ja"]
  [[module.mounts]]
    source = "content/zh-hans"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["zh-hans"]
  [[module.mounts]]
    source = "content/ar"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["ar"]
  [[module.mounts]]
    source = "content/de"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["de"]
  [[module.mounts]]
    source = "content/es"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["es"]
  [[module.mounts]]
    source = "content/it"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["it"]
  [[module.mounts]]
    source = "content/ko"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["ko"]
  [[module.mounts]]
    source = "content/pt-br"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["pt-br"]
  [[module.mounts]]
    source = "content/pt-pt"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["pt-pt"]
  [[module.mounts]]
    source = "content/nl"
    target = "content"
    [module.mounts.sites]
      [module.mounts.sites.matrix]
        languages = ["nl"]

[params]
  sitemapBaseURL = "https://safekit-dev.eviden.com/"

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]
