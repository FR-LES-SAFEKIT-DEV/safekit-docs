<nav class="breadcrumb" aria-label="Breadcrumb">
{{ $items := partial "breadcrumb-items.html" . }}
{{ range $index, $item := $items }}
    {{ if gt $index 0 }}<span class="sep">›</span>{{ end }}
    {{ if eq $index (sub (len $items) 1) }}
    <span class="current">{{ $item.name }}</span>
    {{ else }}
    <a href="{{ $item.relativeURL }}">{{ $item.name }}</a>
    {{ end }}
{{ end }}
</nav>
